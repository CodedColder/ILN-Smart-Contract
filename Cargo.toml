[workspace]
resolver = "2"
members = [
  "contracts/*",
]

# `contracts/*` globs every directory under contracts/, including ones that
# are containers rather than crates (no Cargo.toml of their own). Cargo errors
# out on those, so they have to be excluded explicitly.
exclude = [
  "contracts/tests",
  # Holds twap_oracle/, an example crate that is not part of the build.
  "contracts/examples",
]

[workspace.dependencies]
soroban-sdk = "27.0.6"
# Pinned to the exact version soroban-sdk 27.0.6 resolves internally (see
# Cargo.lock) so `InvocationResourceLimits` / `NetworkInvocationResourceLimits`
# (used by tests exercising Issue #1067's resource-limit-enforcement path)
# reference the identical type the SDK's own `CostEstimate` API uses.
soroban-env-host = "27.0.1"
proptest = "1"
rand = "0.10.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
