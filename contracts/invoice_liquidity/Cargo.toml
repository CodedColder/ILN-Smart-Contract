[package]
name = "invoice_liquidity"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
insurance_pool = { path = "../insurance_pool", version = "0.1.0" }
soroban-sdk = { workspace = true }

[dev-dependencies]
ed25519-dalek = "2.2.0"
iln_governance = { path = "../iln_governance" }
# Issue #706: the full-protocol-lifecycle test needs the real
# iln_distribution and reputation_bonus contracts to genuinely exercise all
# five contracts' cross-contract wiring, not mocks.
iln_distribution = { path = "../iln_distribution" }
reputation_bonus = { path = "../reputation_bonus" }
proptest = { workspace = true }
rand = { workspace = true }
serde_json = "1.0.149"
soroban-sdk = { workspace = true, features = ["testutils"] }
# `testutils` gates `InvocationResourceLimits` (used by
# tests_resource_limit_failure.rs, Issue #1067) in soroban-env-host itself.
soroban-env-host = { workspace = true, features = ["testutils"] }

[[test]]
name = "multi_token_test"
path = "../tests/multi_token_test.rs"

[[test]]
name = "governance_main_integration_test"
path = "../tests/governance_main_integration_test.rs"

[[test]]
name = "oracle_integration_test"
path = "../tests/oracle_integration_test.rs"

[[test]]
name = "full_protocol_lifecycle_test"
path = "../tests/full_protocol_lifecycle_test.rs"

[[test]]
name = "cross_contract_invariants_test"
path = "../tests/cross_contract_invariants_test.rs"

[[test]]
name = "audit_regression_test"
path = "../tests/audit_regression_test.rs"
